<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writor | What will you write...?</title>
  
  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;0,7..72,600;1,7..72,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Quill Rich Text Editor -->
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  
  <!-- Toastr for beautiful notifications -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet">
  
  <!-- Animate.css for animations -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  
  <!-- Font Awesome for more icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --bg-cream: #fcf9f2;
      --bg-paper: #fffdf8;
      --ink-soft: #3a3a3a;
      --accent-lilac: #b8a9c9;
      --accent-sage: #a3b899;
      --accent-warm: #e6cba8;
      --shadow-soft: 0 12px 30px rgba(0,0,0,0.08);
      --border-soft: 1px solid rgba(180, 160, 140, 0.2);
    }
    
    * {
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #fdfbf5 0%, #f0e8dd 100%);
      font-family: 'Quicksand', sans-serif;
      color: var(--ink-soft);
      min-height: 100vh;
      padding: 1.5rem;
    }
    
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(255, 253, 248, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 2rem;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      animation: fadeIn 0.5s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .toolbar-section {
      background: rgba(255,255,255,0.6);
      border-radius: 1rem;
      padding: 1rem;
      margin-bottom: 1rem;
      border: var(--border-soft);
    }
    
    .stats-badge {
      background: white;
      border-radius: 20px;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    /* Quill Custom Styles */
    #editor-container {
      background: white;
      border-radius: 1rem;
      min-height: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    
    .ql-toolbar.ql-snow {
      border: none;
      background: #f8f4ed;
      border-radius: 1rem 1rem 0 0;
      padding: 0.8rem;
    }
    
    .ql-container.ql-snow {
      border: none;
      font-family: 'Literata', serif;
      font-size: 1.1rem;
      border-radius: 0 0 1rem 1rem;
    }
    
    .ql-editor {
      min-height: 400px;
      line-height: 1.8;
    }
    
    /* Custom buttons */
    .btn-gradient {
      background: linear-gradient(135deg, #cdbc9f, #b8a48e);
      border: none;
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 25px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(184, 164, 142, 0.4);
    }
    
    .word-count-animation {
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="app-container animate__animated animate__fadeInUp">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
      <div class="d-flex align-items-center">
        <i class="fas fa-feather-alt text-muted me-2" style="font-size: 2rem;"></i>
        <h1 class="mb-0" style="font-weight: 600; color: #5e4b3c;">Writor</h1>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-outline-secondary" id="newDocBtn">
          <i class="fas fa-file me-1"></i> New
        </button>
        <button class="btn btn-outline-secondary" id="openFileBtn">
          <i class="fas fa-folder-open me-1"></i> Open
        </button>
        <div class="dropdown">
          <button class="btn btn-gradient dropdown-toggle" data-bs-toggle="dropdown">
            <i class="fas fa-download me-1"></i> Export
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#" data-export="txt"><i class="fas fa-file-text me-2"></i>Text (.txt)</a></li>
            <li><a class="dropdown-item" href="#" data-export="md"><i class="fas fa-markdown me-2"></i>Markdown (.md)</a></li>
            <li><a class="dropdown-item" href="#" data-export="html"><i class="fas fa-code me-2"></i>HTML (.html)</a></li>
            <li><a class="dropdown-item" href="#" data-export="rtf"><i class="fas fa-file-alt me-2"></i>Rich Text (.rtf)</a></li>
            <li><a class="dropdown-item" href="#" data-export="pdf"><i class="fas fa-file-pdf me-2"></i>PDF (.pdf)</a></li>
            <li><a class="dropdown-item" href="#" data-export="docx"><i class="fas fa-file-word me-2"></i>Word (.docx)</a></li>
          </ul>
        </div>
        <input type="file" id="fileInput" accept=".txt,.md,.markdown,.html,.htm,.rtf,.pdf,.doc,.docx" style="display:none">
      </div>
    </div>
    
    <!-- Stats Bar -->
    <div class="d-flex gap-2 mb-3 flex-wrap">
      <span class="stats-badge"><i class="fas fa-file-lines me-1"></i>Words: <span id="wordCount">0</span></span>
      <span class="stats-badge"><i class="fas fa-paragraph me-1"></i>Characters: <span id="charCount">0</span></span>
      <span class="stats-badge"><i class="fas fa-clock me-1"></i>Reading time: <span id="readingTime">0</span> min</span>
      <span class="stats-badge"><i class="fas fa-save me-1"></i>Auto-saved <span id="lastSaved">just now</span></span>
    </div>
    
    <!-- Rich Text Editor Toolbar -->
    <div class="toolbar-section">
      <div id="toolbar">
        <select class="ql-header">
          <option value="1">Heading 1</option>
          <option value="2">Heading 2</option>
          <option value="3">Heading 3</option>
          <option selected>Normal</option>
        </select>
        <select class="ql-font">
          <option selected>Literata</option>
          <option value="serif">Serif</option>
          <option value="monospace">Monospace</option>
        </select>
        <button class="ql-bold"></button>
        <button class="ql-italic"></button>
        <button class="ql-underline"></button>
        <button class="ql-strike"></button>
        <select class="ql-color"></select>
        <select class="ql-background"></select>
        <button class="ql-list" value="ordered"></button>
        <button class="ql-list" value="bullet"></button>
        <button class="ql-blockquote"></button>
        <button class="ql-code-block"></button>
        <button class="ql-link"></button>
        <button class="ql-image"></button>
        <button class="ql-clean"></button>
      </div>
      <div id="editor-container"></div>
    </div>
    
    <!-- Quick Actions -->
    <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap">
      <div class="text-muted">
        <i class="fas fa-cloud-upload-alt me-1"></i> Drag & drop files here or use the buttons
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary" id="fullscreenBtn">
          <i class="fas fa-expand me-1"></i> Fullscreen
        </button>
        <button class="btn btn-sm btn-outline-secondary" id="statsToggleBtn">
          <i class="fas fa-chart-bar me-1"></i> Toggle Stats
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown@7.1.2/dist/turndown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.0.0/docx.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <script>
    // Initialize Quill
    const quill = new Quill('#editor-container', {
      theme: 'snow',
      modules: {
        toolbar: '#toolbar'
      },
      placeholder: 'Write freely... poems, stories, excerpts, dreams...'
    });
    
    // Toastr configuration
    toastr.options = {
      "closeButton": true,
      "progressBar": true,
      "positionClass": "toast-bottom-right",
      "timeOut": "3000"
    };
    
    // Update stats on change
    quill.on('text-change', function() {
      const text = quill.getText();
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const chars = text.length;
      const readingMinutes = Math.ceil(words / 200); // Average reading speed
      
      document.getElementById('wordCount').textContent = words;
      document.getElementById('charCount').textContent = chars;
      document.getElementById('readingTime').textContent = readingMinutes;
      document.getElementById('lastSaved').textContent = 'just now';
      
      // Auto-save to localStorage
      localStorage.setItem('tranquil-scribe-content', JSON.stringify(quill.getContents()));
    });
    
    // Load saved content
    const savedContent = localStorage.getItem('tranquil-scribe-content');
    if (savedContent) {
      quill.setContents(JSON.parse(savedContent));
    }
    
    // New document
    document.getElementById('newDocBtn').addEventListener('click', function() {
      if (confirm('Start a new document? This will clear current content.')) {
        quill.setContents([]);
        localStorage.removeItem('tranquil-scribe-content');
        toastr.info('New document created');
      }
    });
    
    // Open file
    document.getElementById('openFileBtn').addEventListener('click', function() {
      document.getElementById('fileInput').click();
    });
    
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const extension = file.name.split('.').pop().toLowerCase();
      const reader = new FileReader();
      
      reader.onload = function(e) {
        const content = e.target.result;
        
        if (['txt', 'md', 'markdown'].includes(extension)) {
          // Plain text or markdown
          if (extension === 'md' || extension === 'markdown') {
            const converter = new showdown.Converter();
            const html = converter.makeHtml(content);
            quill.clipboard.dangerouslyPasteHTML(html);
          } else {
            quill.setText(content);
          }
        } else if (extension === 'html' || extension === 'htm') {
          quill.clipboard.dangerouslyPasteHTML(content);
        } else if (extension === 'rtf') {
          // Simple RTF to text conversion
          const plainText = content.replace(/\\par[d]?/g, '\n')
                                  .replace(/\\[a-zA-Z]+-?\d* ?/g, '')
                                  .replace(/[{}]/g, '')
                                  .replace(/\\'[0-9a-fA-F]{2}/g, '');
          quill.setText(plainText);
        } else if (extension === 'docx') {
          // Use mammoth to convert docx to HTML
          mammoth.convertToHtml({arrayBuffer: e.target.result})
            .then(result => {
              quill.clipboard.dangerouslyPasteHTML(result.value);
            })
            .catch(err => toastr.error('Error reading DOCX file'));
        }
        
        toastr.success(`Opened ${file.name}`);
        document.getElementById('fileInput').value = '';
      };
      
      if (extension === 'docx') {
        reader.readAsArrayBuffer(file);
      } else {
        reader.readAsText(file);
      }
    });
    
    // Export functions
    function exportText() {
      const text = quill.getText();
      const blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
      saveAs(blob, 'writing.txt');
      toastr.success('Exported as TXT');
    }
    
    function exportMarkdown() {
      const html = quill.root.innerHTML;
      const turndownService = new TurndownService();
      const markdown = turndownService.turndown(html);
      const blob = new Blob([markdown], {type: 'text/markdown;charset=utf-8'});
      saveAs(blob, 'writing.md');
      toastr.success('Exported as Markdown');
    }
    
    function exportHTML() {
      const html = quill.root.innerHTML;
      const fullHTML = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Writing Export</title>
  <style>
    body { max-width: 800px; margin: 2rem auto; padding: 0 20px; font-family: Georgia, serif; }
  </style>
</head>
<body>${html}</body>
</html>`;
      const blob = new Blob([fullHTML], {type: 'text/html;charset=utf-8'});
      saveAs(blob, 'writing.html');
      toastr.success('Exported as HTML');
    }
    
    function exportRTF() {
      const text = quill.getText();
      const escaped = text.replace(/\\/g, '\\\\').replace(/\{/g, '\\{').replace(/\}/g, '\\}').replace(/\n/g, '\\par\n');
      const rtfContent = `{\\rtf1\\ansi\\deff0 {\\fonttbl {\\f0 Times New Roman;}}\n\\f0\\fs24 ${escaped}\n}`;
      const blob = new Blob([rtfContent], {type: 'application/rtf'});
      saveAs(blob, 'writing.rtf');
      toastr.success('Exported as RTF');
    }
    
    async function exportPDF() {
      const { PDFDocument, StandardFonts, rgb } = PDFLib;
      const pdfDoc = await PDFDocument.create();
      const page = pdfDoc.addPage();
      const font = await pdfDoc.embedFont(StandardFonts.TimesRoman);
      const text = quill.getText();
      
      page.drawText(text, {
        x: 50,
        y: page.getHeight() - 50,
        size: 12,
        font: font,
        maxWidth: 500,
        lineHeight: 18,
        color: rgb(0, 0, 0)
      });
      
      const pdfBytes = await pdfDoc.save();
      const blob = new Blob([pdfBytes], {type: 'application/pdf'});
      saveAs(blob, 'writing.pdf');
      toastr.success('Exported as PDF');
    }
    
    async function exportDOCX() {
      const text = quill.getText();
      const doc = new docx.Document({
        sections: [{
          properties: {},
          children: [
            new docx.Paragraph({
              children: [
                new docx.TextRun({
                  text: text,
                  size: 24, // 12pt
                }),
              ],
            }),
          ],
        }],
      });
      
      const blob = await docx.Packer.toBlob(doc);
      saveAs(blob, 'writing.docx');
      toastr.success('Exported as DOCX');
    }
    
    // Export dropdown handlers
    document.querySelectorAll('[data-export]').forEach(item => {
      item.addEventListener('click', function(e) {
        e.preventDefault();
        const format = this.getAttribute('data-export');
        
        switch(format) {
          case 'txt': exportText(); break;
          case 'md': exportMarkdown(); break;
          case 'html': exportHTML(); break;
          case 'rtf': exportRTF(); break;
          case 'pdf': exportPDF(); break;
          case 'docx': exportDOCX(); break;
        }
      });
    });
    
    // Fullscreen toggle
    document.getElementById('fullscreenBtn').addEventListener('click', function() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });
    
    // Stats toggle
    let statsVisible = true;
    document.getElementById('statsToggleBtn').addEventListener('click', function() {
      statsVisible = !statsVisible;
      document.querySelectorAll('.stats-badge').forEach(badge => {
        badge.style.display = statsVisible ? 'inline-block' : 'none';
      });
    });
    
    // Drag and drop
    document.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.stopPropagation();
    });
    
    document.addEventListener('drop', function(e) {
      e.preventDefault();
      e.stopPropagation();
      
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        const file = files[0];
        document.getElementById('fileInput').files = files;
        document.getElementById('fileInput').dispatchEvent(new Event('change'));
      }
    });
    
    // Welcome message
    toastr.success('Welcome to Writor! ✨', 'by Levermake');
  </script>
</body>
</html>
