<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects/Apps</title>
  
  <!-- Bootstrap 5 + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --text-primary: #e8e8f0;
      --text-secondary: #a0a0b0;
      --accent-1: #6c5ce7;
      --accent-2: #00b894;
      --accent-3: #fd79a8;
      --accent-4: #fdcb6e;
      --border-color: #2a2a3a;
      --hover-glow: rgba(108, 92, 231, 0.3);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: var(--bg-primary);
      font-family: 'Outfit', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem;
      position: relative;
      overflow-x: hidden;
    }
    
    /* Animated background particles */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(108, 92, 231, 0.1), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 184, 148, 0.1), transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(253, 121, 168, 0.05), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    
    .container-main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    /* Header Section */
    .header-section {
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeInDown 0.8s ease;
    }
    
    .title {
      font-size: 3.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #6c5ce7, #00b894, #fd79a8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    
    .subtitle {
      color: var(--text-secondary);
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 2px;
    }
    
    /* Edit Nav Button */
    .edit-nav-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      animation: fadeInRight 0.6s ease;
    }
    
    .edit-nav-btn:hover {
      background: var(--accent-1);
      border-color: var(--accent-1);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
    }
    
    /* Filter Buttons */
    .filter-section {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      animation: fadeInUp 0.6s ease;
    }
    
    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.6rem 1.2rem;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.9rem;
      font-weight: 500;
    }
    
    .filter-btn:hover,
    .filter-btn.active {
      background: var(--accent-1);
      border-color: var(--accent-1);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px var(--hover-glow);
    }
    
    /* Projects Grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    
    /* Project Card */
    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.5s ease;
    }
    
    .project-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-color, #6c5ce7), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .project-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-color, #6c5ce7);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    
    .project-card:hover::before {
      opacity: 1;
    }
    
    .project-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: var(--accent-color, #6c5ce7);
    }
    
    .project-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }
    
    .project-description {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1rem;
    }
    
    .project-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    
    .tag {
      background: rgba(108, 92, 231, 0.1);
      color: var(--accent-1);
      padding: 0.3rem 0.8rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    
    /* Edit Modal */
    .edit-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 2000;
      backdrop-filter: blur(10px);
    }
    
    .edit-modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }
    
    .modal-content {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2rem;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    .modal-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
    }
    
    .json-editor {
      width: 100%;
      min-height: 300px;
      background: #0a0a0f;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--accent-2);
      font-family: 'JetBrains Mono', monospace;
      padding: 1rem;
      font-size: 0.9rem;
      resize: vertical;
    }
    
    .btn-save {
      background: linear-gradient(135deg, var(--accent-1), #8b7cf7);
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1rem;
    }
    
    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
    }
    
    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.8rem 1.5rem;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1rem;
    }
    
    .btn-cancel:hover {
      background: var(--bg-card);
    }
    
    /* Animations */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeInRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .title {
        font-size: 2.5rem;
      }
      
      .projects-grid {
        grid-template-columns: 1fr;
      }
      
      .edit-nav-btn {
        top: 10px;
        right: 10px;
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <!-- Edit Navigation Button -->
  <button class="edit-nav-btn" onclick="openEditor()">
    <i class="bi bi-pencil-square me-2"></i>Edit Nav
  </button>
  
  <div class="container-main">
    <!-- Header -->
    <div class="header-section">
      <h1 class="title">My Projects</h1>
      <p class="subtitle">A collection of my creative work</p>
    </div>
    
    <!-- Filter Section -->
    <div class="filter-section" id="filterSection">
      <button class="filter-btn active" data-filter="all">All</button>
    </div>
    
    <!-- Projects Grid -->
    <div class="projects-grid" id="projectsGrid">
      <!-- Projects will be rendered here -->
    </div>
  </div>
  
  <!-- Edit Modal -->
  <div class="edit-modal" id="editModal">
    <div class="modal-content">
      <h3 class="modal-title">
        <i class="bi bi-pencil-square me-2"></i>Edit Navigation
      </h3>
      <p class="text-muted mb-3">Edit the JSON below to update your projects list:</p>
      <textarea class="json-editor" id="jsonEditor"></textarea>
      <div class="d-flex gap-2">
        <button class="btn-save" onclick="saveProjects()">
          <i class="bi bi-check-circle me-2"></i>Save Changes
        </button>
        <button class="btn-cancel" onclick="closeEditor()">
          <i class="bi bi-x-circle me-2"></i>Cancel
        </button>
      </div>
    </div>
  </div>
  
  <script>
    // Default projects data - THIS IS WHAT YOU EDIT
    const defaultProjects = [
      {
        "id": "tranquil-scribe",
        "title": "Tranquil Scribe",
        "description": "A peaceful writing studio for poems, stories, and creative expression",
        "icon": "bi-feather",
        "color": "#6c5ce7",
        "tags": ["writing", "creative", "editor"],
        "url": "./tranquil-scribe.html",
        "category": "creative"
      },
      {
        "id": "pixel-artist",
        "title": "Pixel Artist",
        "description": "Create beautiful pixel art with an intuitive canvas and color palette",
        "icon": "bi-grid-3x3-gap",
        "color": "#00b894",
        "tags": ["art", "pixel", "canvas"],
        "url": "./pixel-artist.html",
        "category": "art"
      },
      {
        "id": "code-playground",
        "title": "Code Playground",
        "description": "Test and share HTML, CSS, and JavaScript snippets in real-time",
        "icon": "bi-code-square",
        "color": "#fd79a8",
        "tags": ["code", "developer", "testing"],
        "url": "./code-playground.html",
        "category": "developer"
      },
      {
        "id": "music-visualizer",
        "title": "Music Visualizer",
        "description": "Watch your music come alive with stunning audio-reactive visuals",
        "icon": "bi-music-note-beamed",
        "color": "#fdcb6e",
        "tags": ["music", "visualization", "audio"],
        "url": "./music-visualizer.html",
        "category": "creative"
      },
      {
        "id": "task-tracker",
        "title": "Task Tracker",
        "description": "Stay organized with a beautiful and intuitive task management system",
        "icon": "bi-check2-square",
        "color": "#e17055",
        "tags": ["productivity", "tasks", "organization"],
        "url": "./task-tracker.html",
        "category": "productivity"
      },
      {
        "id": "weather-app",
        "title": "Weather Dashboard",
        "description": "Check the weather anywhere in the world with this beautiful dashboard",
        "icon": "bi-cloud-sun",
        "color": "#0984e3",
        "tags": ["weather", "api", "dashboard"],
        "url": "./weather-app.html",
        "category": "utility"
      }
    ];
    
    // Load projects from localStorage or use defaults
    let projects = JSON.parse(localStorage.getItem('projectsList') || JSON.stringify(defaultProjects));
    
    // Initialize the app
    function init() {
      renderProjects();
      renderFilters();
    }
    
    // Render projects to the grid
    function renderProjects(filter = 'all') {
      const grid = document.getElementById('projectsGrid');
      grid.innerHTML = '';
      
      const filteredProjects = filter === 'all' 
        ? projects 
        : projects.filter(p => p.category === filter);
      
      filteredProjects.forEach(project => {
        const card = document.createElement('div');
        card.className = 'project-card animate__animated animate__fadeInUp';
        card.style.setProperty('--accent-color', project.color);
        card.onclick = () => window.location.href = project.url;
        
        card.innerHTML = `
          <div class="project-icon">
            <i class="bi ${project.icon}"></i>
          </div>
          <h3 class="project-title">${project.title}</h3>
          <p class="project-description">${project.description}</p>
          <div class="project-tags">
            ${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        `;
        
        grid.appendChild(card);
      });
    }
    
    // Render filter buttons
    function renderFilters() {
      const filterSection = document.getElementById('filterSection');
      const categories = ['all', ...new Set(projects.map(p => p.category))];
      
      filterSection.innerHTML = '';
      categories.forEach(category => {
        const button = document.createElement('button');
        button.className = 'filter-btn';
        button.dataset.filter = category;
        button.textContent = category.charAt(0).toUpperCase() + category.slice(1);
        button.onclick = () => {
          document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');
          renderProjects(category);
        };
        filterSection.appendChild(button);
      });
    }
    
    // Open the JSON editor
    function openEditor() {
      const modal = document.getElementById('editModal');
      const editor = document.getElementById('jsonEditor');
      editor.value = JSON.stringify(projects, null, 2);
      modal.classList.add('show');
    }
    
    // Close the editor
    function closeEditor() {
      const modal = document.getElementById('editModal');
      modal.classList.remove('show');
    }
    
    // Save projects from JSON editor
    function saveProjects() {
      try {
        const editor = document.getElementById('jsonEditor');
        const newProjects = JSON.parse(editor.value);
        
        // Validate the data structure
        if (!Array.isArray(newProjects)) {
          throw new Error('Projects must be an array');
        }
        
        projects = newProjects;
        localStorage.setItem('projectsList', JSON.stringify(projects));
        
        // Re-render everything
        renderFilters();
        renderProjects();
        
        // Close modal and show success message
        closeEditor();
        showToast('Navigation updated successfully! ✨');
      } catch (error) {
        showToast('Invalid JSON format. Please check your syntax.', 'error');
      }
    }
    
    // Simple toast notification
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: ${type === 'success' ? '#00b894' : '#fd79a8'};
        color: white;
        padding: 1rem 1.5rem;
        border-radius: 12px;
        font-weight: 500;
        z-index: 3000;
        animation: fadeInUp 0.3s ease;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      `;
      toast.textContent = message;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.animation = 'fadeIn 0.3s ease reverse';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
    
    // Keyboard shortcut to open editor (Ctrl+E)
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'e') {
        e.preventDefault();
        openEditor();
      }
    });
    
    // Close modal when clicking outside
    document.getElementById('editModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) {
        closeEditor();
      }
    });
    
    // Initialize the app
    init();
  </script>
</body>
</html>
